name: agent-stack

# Production-shaped compose file. Notes:
# * Secrets live in .env (not committed) — see .env.example for the shape.
# * `sandbox-agent` runs as non-root with resource caps and dropped caps.
# * `openapi-proxy` is the only public-facing API; it requires a bearer
#   token via the OPENAPI_PROXY_TOKEN env var.
# * `open-webui` is reachable only inside the agent-net bridge; expose
#   to the host only if you want LAN access.

services:
  sandbox-agent:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        # The privilege mode. 0 = the agent's shell cannot become root:
        # there is no sudo in the image and no setuid binary that could
        # help. 1 = the image ships sudo and a NOPASSWD rule, so a
        # command can run `sudo su` and become root inside the container.
        # PRIVATE, SECURED DEPLOYMENTS ONLY — see docs/SECURITY.md.
        AGENT_ALLOW_SUDO: "${AGENT_ALLOW_SUDO:-0}"
    container_name: sandbox-agent
    restart: unless-stopped
    networks:
      - agent-net
    # No host port mapping — the agent is reachable only from inside
    # the agent-net Docker network (i.e. from openapi-proxy). The bearer
    # token is still required for defence in depth, but network
    # isolation is the primary control.
    expose:
      - "8082"
    # Non-root with explicit UID. Bump the gid if your host's docker group
    # has a different numeric id — use `getent group docker`.
    user: "1000:1000"
    working_dir: /workspace
    # Resource caps — adjust for your hardware. ``pids_limit`` matters most:
    # it stops a fork-bomb from killing the host kernel.
    mem_limit: 2g
    cpus: "2.0"
    # How many processes the agent's shell may spawn. 256 is the safe
    # default — a fork-bomb dies here, not on the host. Raise it when a
    # build fans out (make -j, npm, pip workers) and the legitimate
    # processes start failing with "Resource temporarily unavailable".
    pids_limit: "${AGENT_PIDS_LIMIT:-256}"
    # Drop all capabilities, then re-add only what's needed. tmux, ssh,
    # and basic networking do not need any of the dropped caps.
    #
    # The two knobs below are the runtime half of the privilege mode.
    # Their defaults are the stock posture: an empty capability set and
    # no-new-privileges on. To let the agent's shell become root, both
    # have to give way — the setuid bit is inert while no-new-privileges
    # is on, and su cannot work at all while the bounding set is empty.
    # See docs/SECURITY.md, "The privilege mode".
    cap_drop:
      - "${AGENT_CAP_DROP:-ALL}"
    security_opt:
      - "no-new-privileges:${AGENT_NO_NEW_PRIVILEGES:-true}"
    # Must be at least uvicorn's --timeout-graceful-shutdown (25s) +
    # headroom, otherwise Docker SIGKILLs the container mid-shutdown.
    stop_grace_period: 30s
    # Read-only root filesystem. Writes go through the tmpfs mounts below.
    #
    # THE RULE: WHERE SUDO IS ON, THE ROOT HAS TO BE WRITABLE.
    # A root that cannot write is a half-root. apt-get needs three
    # writable paths (/var/lib/apt/lists, /var/lib/dpkg and /usr) and
    # gets "Read-only file system" for all three, so a privileged shell
    # cannot install anything and the model calls the sandbox broken.
    # The default below is read-only, and that is right for the default
    # deployment, which has no sudo. A deployment that turns the
    # privilege mode on sets AGENT_READ_ONLY=false as well --
    # tools/check-posture.sh refuses a half-root. See docs/SECURITY.md,
    # "The privilege mode".
    read_only: "${AGENT_READ_ONLY:-true}"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=64m,mode=755
      # The download caches are tmpfs: they are rewritten on every apt-get
      # and pip install, and a named volume is a directory on the host's
      # disk.
      - /var/cache/apt:size=128m,mode=1777
      - /home/agent/.cache/pip:size=64m,mode=1777
    volumes:
      # The workspace is on disk, and it has a ceiling.
      #
      # The volume is named, but it does not live in
      # /var/lib/docker/volumes: its driver binds a host path, and that
      # path is the mount point of an ext4 filesystem in a file of
      # AGENT_WORKSPACE_SIZE. Docker has no quota for a volume -- the
      # ceiling has to come from the filesystem -- and
      # tools/setup-workspace.sh is what makes that filesystem.
      #
      # Until it has run, this volume is a plain directory on the host's
      # disk and the ceiling is a promise instead of a fact. The deploy
      # scripts run it; the verifier checks it.
      - owbs-workspace:/workspace
      # The only host path the agent sees is the SSH key directory, and
      # it is read-only. A read-only bind stays read-only even for a
      # root command inside the container: remounting it needs a
      # capability (CAP_SYS_ADMIN) the container does not have.
      - /opt/agent-workspace/.ssh:/home/agent/.ssh:ro
      # NOTE: there is deliberately NO volume mounted at /home/agent. The
      # application code lives there (WORKDIR is /home/agent so the import
      # path resolves), and Docker seeds a named volume from the image on
      # first use and never re-syncs it. A volume at that path therefore
      # shadows the code with the copy from the first run, and every later
      # image rebuild becomes a no-op: the repository moves, the container
      # does not. Sub-paths are fine — they do not cover the code.
    environment:
      - AGENT_WORKSPACE=/workspace
      # The ceiling the workspace is supposed to have. The mount of the
      # workspace belongs to this stack -- it is made when the stack starts,
      # and it is NOT in the host's /etc/fstab -- so the agent checks the
      # filesystem it is looking at and refuses to serve against a plain
      # directory, which has no ceiling at all.
      - AGENT_WORKSPACE_SIZE=${AGENT_WORKSPACE_SIZE:-}
      - AGENT_SESSIONS_FILE=/workspace/.agent-sessions.json
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-INFO}
      # How much text one command may return. 32k..1024k.
      # The pane scrollback is derived from it, so the limit is
      # honest: an output that fits comes back whole, every time.
      - AGENT_STDOUT_LIMIT=${AGENT_STDOUT_LIMIT:-512k}
      # How large a file the binary endpoint will serve. 0 = unlimited.
      # Bytes never travel through stdout, so this is policy, not transport.
      - AGENT_BINARY_LIMIT=${AGENT_BINARY_LIMIT:-2048k}
      # The upload door's transport ceiling. It has to be at least the
      # binary limit above: a transport ceiling below the file policy
      # refuses an upload the door itself would have accepted.
      - AGENT_UPLOAD_MAX_BYTES=${AGENT_UPLOAD_MAX_BYTES:-64m}
      # How many bytes one MCP read_file may put into a model's context.
      # 0 = no budget of its own. The HTTP /files door keeps its own
      # limit: there the bytes land in a file, not in a prompt.
      - AGENT_MCP_MAX_READ_BYTES=${AGENT_MCP_MAX_READ_BYTES:-1m}
      # Same token as OPENAPI_PROXY_TOKEN — the proxy forwards it on
      # every call. The agent refuses to serve if this is empty.
      # The token the agent accepts on its own doors. It defaults to the
      # proxy's token — one credential for the whole stack — which is the
      # simple single-operator shape. Set AGENT_INBOUND_TOKEN to a
      # **different** value and the two roles separate: the operator's
      # token stays out of this container, and the model's shell (which
      # inherits this environment) can only ever see the internal one.
      # See docs/SECURITY.md, "The sandbox is not a boundary".
      - AGENT_TOKEN=${AGENT_INBOUND_TOKEN:-${OPENAPI_PROXY_TOKEN:?OPENAPI_PROXY_TOKEN must be set}}
      # The Host header values the MCP endpoint answers for. Empty =
      # no check at all — the check is off by default. A deployment
      # behind a domain names it here, or the MCP endpoint answers 421.
      - AGENT_MCP_ALLOWED_HOSTS=${AGENT_MCP_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  openapi-proxy:
    build:
      context: .
      dockerfile: Dockerfile.openapi-proxy
    container_name: openapi-proxy
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      # The address the stack is published on is the operator's choice,
      # not a constant in this file: the default is the loopback, and a
      # deployment that needs another machine to reach it sets
      # SANDBOX_BIND_HOST (0.0.0.0 to publish on every interface).
      - "${SANDBOX_BIND_HOST:-127.0.0.1}:8090:8090"
    environment:
      - SANDBOX_URL=http://sandbox-agent:8082
      - OPENAPI_PROXY_TOKEN=${OPENAPI_PROXY_TOKEN:?OPENAPI_PROXY_TOKEN must be set}
      # The token the proxy uses to call sandbox-agent. Empty = the same
      # token as above, which is the usual single-trust-boundary case.
      # When the agent has its own inbound token, the proxy must send
      # that one — hence the fallback chain: an explicit value, then the
      # agent's inbound token, then the proxy's own.
      - OPENAPI_PROXY_UPSTREAM_TOKEN=${OPENAPI_PROXY_UPSTREAM_TOKEN:-${AGENT_INBOUND_TOKEN:-${OPENAPI_PROXY_TOKEN}}}
      - OPENAPI_PROXY_CORS_ORIGINS=${OPENAPI_PROXY_CORS_ORIGINS:-}
      - OPENAPI_PROXY_SSH_ALLOWLIST=${OPENAPI_PROXY_SSH_ALLOWLIST:-}
      - OPENAPI_PROXY_RATE_LIMIT_RPM=${OPENAPI_PROXY_RATE_LIMIT_RPM:-120}
      - OPENAPI_PROXY_RATE_LIMIT_MAX_KEYS=${OPENAPI_PROXY_RATE_LIMIT_MAX_KEYS:-10000}
      # The proxy's transport ceiling for an upload. It has to be at least
      # the agent's file policy (AGENT_BINARY_LIMIT).
      - OPENAPI_PROXY_UPLOAD_MAX_BYTES=${OPENAPI_PROXY_UPLOAD_MAX_BYTES:-67108864}
      - OPENAPI_PROXY_WEBSOCKET_IDLE_TIMEOUT=${OPENAPI_PROXY_WEBSOCKET_IDLE_TIMEOUT:-300}
      # The longest a single command may run. The proxy waits longer than this,
      # so the answer that says "this timed out" survives the trip.
      - AGENT_EXEC_TIMEOUT=${AGENT_EXEC_TIMEOUT:-60}
      - OPENAPI_PROXY_LOG_LEVEL=INFO
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    depends_on:
      sandbox-agent:
        condition: service_healthy
    healthcheck:
      test:
        # Python, not curl: the proxy image installs nothing from the
        # distribution, so there is no curl in it to call.
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/openapi.json', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      - "${SANDBOX_BIND_HOST:-127.0.0.1}:3001:8080"
    # whisper-api usually runs on the host, not in this network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume — NOT bind-mounted into /workspace. The Open WebUI
      # SQLite (chats, users, settings) must stay out of the agent's
      # writable surface, otherwise the LLM can do ``rm -rf
      # /workspace/.open-webui-data`` and wipe the database.
      # See docs/SECURITY.md → Trust model.
      - open-webui-data:/app/backend/data
    environment:
      # All secrets come from .env — see .env.example.
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-user}
      - ENABLE_AUDIO_STT=true
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=${AUDIO_STT_OPENAI_API_BASE_URL:-http://host.docker.internal:8000/v1}
      - AUDIO_STT_OPENAI_API_KEY=${WHISPER_API_KEY:-sk-not-needed}
      - TOOL_SERVER_CONNECTIONS=[{"type":"openapi","url":"http://openapi-proxy:8090","path":"openapi.json","info":{"id":"sandbox-tools","name":"SandboxTools","description":"Persistent shell"},"config":{"enable":true},"auth_type":"bearer","key":"${OPENAPI_PROXY_TOKEN}","spec_type":"url"}]
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=64m,mode=755
    stop_grace_period: 30s
    depends_on:
      sandbox-agent:
        condition: service_healthy
      openapi-proxy:
        condition: service_started

volumes:
  # The agent's workspace: a named volume whose driver binds a host
  # path -- the mount point of the ext4 filesystem that
  # tools/setup-workspace.sh makes out of a file of AGENT_WORKSPACE_SIZE.
  # Docker cannot cap a volume, so the ceiling is the filesystem's.
  owbs-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AGENT_WORKSPACE_PATH:-/opt/owbs-workspace}
  # The only volume left here belongs to Open WebUI, and it must stay
  # out of the agent's reach.
  open-webui-data:

networks:
  agent-net:
    driver: bridge
