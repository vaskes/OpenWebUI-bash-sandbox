name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70 tests/ || \
            coverage run --source=. -m unittest discover -s tests && \
            coverage report --fail-under=70
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml

  sast:
    name: SAST (ruff B-rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Bandit was replaced by ruff's B-rules — same coverage on the
      # patterns we care about (subprocess injection, weak crypto,
      # hardcoded creds) without the install-on-CI failure mode.
      - name: Ruff B-rules scan
        run: ruff check . --select B --output-format=concise

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

