name: CI

# Least-privilege: default to read-only token permissions, override
# per-job only when a job needs write access (none currently do —
# lint, test, SAST, and gitleaks all just read the repo).
# Resolves CodeQL alert `actions/missing-workflow-permissions`.
permissions:
  contents: read

on:
  # Every branch, not only `main`. The pull request is where the runs are
  # usually collected, but it is not what makes them binding: the gate is
  # the checks themselves. A branch that runs the whole gate on its own
  # push can be landed as a fast-forward once they are green — without a
  # pull request to carry them, and without the GitHub API to open one.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tmux is not in the runner image, and the strongest tripwires in
      # this suite need a real one: a ~400 KB command output must come
      # back whole on every run, and a session must survive a cold tmux
      # server. Without tmux those tests skip, and the gate silently
      # stops guarding the thing it was written for.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run unit tests with coverage
        run: |
          # No threshold on the command line: the coverage configuration in
          # pyproject.toml owns it (and omits the test files, so the number
          # describes the sources and not the act of running the tests).
          pytest --cov=. --cov-report=xml --cov-report=term tests/ || \
            coverage run --source=. -m unittest discover -s tests && \
            coverage report
      - name: The suite also runs on the stdlib
        # The README promises "stdlib unittest, no pytest required", and
        # the fallback above only runs when pytest is MISSING -- which is
        # exactly when nobody is looking.  Run the stdlib path on
        # purpose: it is a promise about a path, and a promise nobody
        # walks is a promise nobody checks.  (It was broken once: the
        # tmux isolation lived in a pytest fixture, so two of the suite's
        # own tests failed there, and the sessions the live tests made
        # were litter on the machine's default tmux server.)
        run: python -m unittest discover -s tests
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml

  # The suite must be green on a machine that has no tmux.  A test that
  # drives a real tmux session and is not marked ``requires_tmux`` does
  # not skip there — it fails, and the run reads as a red suite instead
  # of as an environment that lacks a tool.  That has already happened
  # once: a restarted sandbox lost its tmux, the suite showed ten red,
  # and the red was read as a defect in the commits.
  suite-without-tmux:
    name: The suite is green without tmux
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # A PATH without tmux, built from the runner's own binaries: the
      # tests ask for tmux by name, and a missing binary is what a
      # machine without tmux looks like.
      #
      # The farm is built from **the whole PATH** and the PATH is then
      # **replaced**, not prepended.  The first version of this job
      # built the farm out of /usr/bin and ran the suite as
      # `PATH=/tmp/no-tmux:$PATH` — and a prepended PATH keeps the
      # original one, /usr/bin included, tmux included.  Measured the
      # way CI runs it:
      #
      #     $ PATH=/tmp/no-tmux:$PATH command -v tmux
      #     /usr/bin/tmux
      #
      # So the job ran the ordinary suite, with tmux, and was green for
      # the wrong reason: a check that cannot be made red is a
      # decoration, and this one looked like a green job.
      - name: Build a PATH without tmux
        run: |
          mkdir -p /tmp/no-tmux
          for d in $(echo "$PATH" | tr ':' ' '); do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              b=$(basename "$f")
              [ "$b" = "tmux" ] && continue
              [ -e "/tmp/no-tmux/$b" ] || ln -sf "$f" "/tmp/no-tmux/$b"
            done
          done
      - name: Run the suite without tmux
        run: PATH=/tmp/no-tmux pytest -q tests/

  sast:
    name: SAST (ruff B-rules)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Bandit was replaced by ruff's B-rules — same coverage on the
      # patterns we care about (subprocess injection, weak crypto,
      # hardcoded creds) without the install-on-CI failure mode.
      - name: Ruff B-rules scan
        run: ruff check . --select B --output-format=concise

  # v2.5.0: this job exists because v2.4.x shipped green CI and did not
  # build. `docker build` failed with "GID '1000' already exists"; nothing
  # in the pipeline ever ran it. Tests ran against the runner's pip
  # environment, not against the artifacts we ship — false confidence,
  # which is worse than no tests. Everything above this line exercises the
  # Python source; only this line exercises the deliverable.
  deploy:
    name: Deploy (docker build + boot + smoke)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No .env in the repo, and the Makefile check-env target would fail
      # on the placeholder values. Pass the token through the environment
      # instead so compose's ${VAR:?} guard sees a real value.
      - name: Build both images from a clean tree
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: docker compose -f docker-compose.ci.yml build

      - name: Boot the stack and wait for both containers to be healthy
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          docker compose -f docker-compose.ci.yml up -d
          # `up -d` returns before the healthchecks pass, and a failure
          # here is the whole point of this job — do not skip the wait.
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]                                  && [ "$(docker inspect -f "{{.State.Health.Status}}" ci-openapi-proxy  2>/dev/null)" = healthy ]; do
                               sleep 3
                             done'             || { echo "::error::containers never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

      # The load-bearing step. A container can report healthy while every
      # request 500s; only executing a real command proves the stack works.
      # This is what catches "No module named uvicorn" and FastAPI
      # constructor drift — neither shows up in a process liveness check.
      - name: Smoke test — execute a real command end to end
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          out=$(curl -fsS --max-time 120 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"echo ci-smoke-ok && id -u","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash)
          echo "proxy response: $out"
          echo "$out" | grep -q 'ci-smoke-ok' || { echo "::error::command did not execute"; exit 1; }
          # uid must be the unprivileged 1000 the compose contract promises.
          echo "$out" | grep -qE '(^|[^0-9])1000([^0-9]|$)' \
            || { echo "::error::agent is not running as uid 1000"; exit 1; }

      # A command that reads stdin must not eat the protocol.
      #
      # The agent types the command and the bookkeeping lines that follow
      # it into the same terminal, so the rest of the block is still in the
      # input buffer when the command starts. A command that reads stdin —
      # `read x`, `apt-get` — used to read those lines instead of waiting,
      # the completion marker never appeared, and the caller waited out the
      # whole limit for an answer that never came.
      #
      # The answer has to arrive, and it has to arrive *quickly*: a command
      # that waits for input is a timeout, not a result.
      - name: A command that reads stdin must answer, and answer at once
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          start=$(date +%s)
          out=$(curl -fsS --max-time 120 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"read x","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash)
          elapsed=$(( $(date +%s) - start ))
          echo "proxy response after ${elapsed}s: $out"
          [ "$elapsed" -lt 20 ] \
            || { echo "::error::the command waited ${elapsed}s for input"; exit 1; }
          echo "$out" | grep -q '"timed_out": *false' \
            || { echo "::error::the command timed out instead of reading EOF"; exit 1; }
          # `read` gets EOF and fails the way a failed read does.
          echo "$out" | grep -q '"exit_code": *1' \
            || { echo "::error::read did not report its exit code"; exit 1; }

          # The stdout must not grow a line because of the group the
          # command runs in. The caller's stdout is the command's output,
          # and it stays that way.
          #
          # The check is on the *stdout field*, not on the whole response:
          # the response is a JSON object, so it has braces of its own.
          #
          # NOTE: `if` and not `grep ... && { ...; }` — under `set -e` the
          # AND-list exits non-zero when the grep finds nothing, and the
          # step dies on a *passing* check.
          stdout=$(printf '%s' "$out" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('stdout',''))")
          if printf '%s' "$stdout" | grep -q 'dev/null'; then
            echo "::error::the protocol leaked into the stdout"; exit 1
          fi
          if printf '%s' "$stdout" | grep -q '[{}]'; then
            echo "::error::the group leaked into the stdout"; exit 1
          fi

      # The MCP door. The endpoint is a product, not a library: a caller
      # that cannot complete a handshake cannot use the sandbox at all,
      # and a handshake that works while the tools do not is worse than
      # no endpoint at all. The check goes through the proxy, because
      # the proxy is the published surface.
      - name: The MCP endpoint must answer a real client
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          call() {
            curl -fsS --max-time 60 \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d "$1" http://127.0.0.1:8099/mcp
          }

          # No token, no door.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            http://127.0.0.1:8099/mcp)
          [ "$code" = "401" ] || { echo "::error::the MCP door answered $code without a token"; exit 1; }

          init=$(call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "initialize: ${init:0:200}"
          printf '%s' "$init" | python3 -c "
          import json,sys
          r = json.load(sys.stdin)['result']
          assert r['protocolVersion'] == '2025-06-18', r['protocolVersion']
          assert r['serverInfo']['name'] == 'openwebui-bash-sandbox', r['serverInfo']
          " || { echo "::error::the handshake did not answer the version the client offered"; exit 1; }

          tools=$(call '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          printf '%s' "$tools" | python3 -c "
          import json,sys
          names = sorted(t['name'] for t in json.load(sys.stdin)['result']['tools'])
          assert names == ['bash','delete_file','file_info','read_file'], names
          " || { echo "::error::the tool catalogue is not the documented one"; exit 1; }

          out=$(call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"bash","arguments":{"command":"echo ci-mcp-ok"}}}')
          echo "call: ${out:0:300}"
          printf '%s' "$out" | python3 -c "
          import json,sys
          r = json.load(sys.stdin)['result']
          assert not r.get('isError'), r
          assert 'ci-mcp-ok' in r['content'][0]['text'], r
          " || { echo "::error::the MCP tool did not run the command"; exit 1; }

      - name: Agent healthz must not leak the workspace path
        run: |
          # docker exec on the container directly, NOT `docker compose exec`:
          # compose re-parses the file and fails interpolation on
          # ${OPENAPI_PROXY_TOKEN:?}, which this step has no reason to carry.
          # The agent publishes no host port, so it is reached in-network.
          body=$(docker exec ci-sandbox-agent curl -fsS http://127.0.0.1:8082/healthz)
          echo "agent healthz: $body"
          [ "$body" = '{"status":"ok"}' ] \
            || { echo "::error::unexpected healthz body"; exit 1; }
          # Belt and braces: v2.4.1 leaked WORKSPACE_REAL here, v2.4.3
          # trimmed it. Assert the absence, not just the exact body.
          case "$body" in
            */workspace*|*WORKSPACE*|*"os.environ"*)
              echo "::error::healthz leaks host detail"; exit 1 ;;
          esac

      # The binary door. A file created in the sandbox must come back
      # through the proxy byte for byte — the whole point of the endpoint
      # is that an agent can move a file out without base64, and base64
      # through a pane loses the beginning of the payload without saying
      # so. A unit test can mock the transport; only this can prove the
      # two services actually agree on the bytes.
      - name: Binary transfer — the bytes must survive the round trip
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          # Create the probe through the tool the agent itself uses.
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"printf ci-binary-probe-payload | tee /workspace/probe.bin >/dev/null && sha256sum /workspace/probe.bin","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash > /tmp/mk.json
          expected=$(grep -o '[0-9a-f]\{64\}' /tmp/mk.json | head -1)
          [ -n "$expected" ] || { echo "::error::could not create the probe file"; exit 1; }

          # Pull it back out through the proxy.
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" \
            -o /tmp/probe.bin 'http://127.0.0.1:8099/files?path=probe.bin'
          actual=$(sha256sum /tmp/probe.bin | cut -d' ' -f1)
          [ "$actual" = "$expected" ] \
            || { echo "::error::sha256 mismatch: $actual != $expected"; exit 1; }

          # The headers a client needs in order to plan a transfer.
          curl -fsS -D /tmp/hdr -o /dev/null --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin'
          grep -qi '^accept-ranges: *bytes' /tmp/hdr || { echo "::error::no Accept-Ranges"; exit 1; }
          grep -qi '^content-length:' /tmp/hdr || { echo "::error::no Content-Length"; exit 1; }

          # A range request must answer 206 with the right slice.
          code=$(curl -s -o /tmp/part.bin -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" -H 'Range: bytes=3-8' \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "206" ] || { echo "::error::range request answered $code"; exit 1; }
          [ "$(cat /tmp/part.bin)" = "binary" ] \
            || { echo "::error::range request returned the wrong bytes"; exit 1; }

          # A file over the policy limit is refused — and says how big it
          # really is, so the caller can decide what to do about it.
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"head -c 3000000 /dev/zero > /workspace/big.bin","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash > /dev/null
          code=$(curl -s -o /tmp/err.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=big.bin')
          [ "$code" = "413" ] || { echo "::error::oversized file answered $code, expected 413"; exit 1; }
          grep -q '3000000' /tmp/err.json \
            || { echo "::error::the 413 does not name the real size"; exit 1; }

          # The purge. The sandbox is a scratchpad: once a client has
          # delivered a file, it removes the copy it made. This has to
          # work in the shipped artifact, not just in a unit test — a
          # delete endpoint that answers 204 and leaves the file on disk
          # is worse than no endpoint at all, because the client trusts
          # it.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X DELETE -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "204" ] || { echo "::error::purge answered $code, expected 204"; exit 1; }
          if docker exec ci-sandbox-agent ls /workspace/probe.bin >/dev/null 2>&1; then
            echo "::error::the file is still in the workspace after the purge"; exit 1
          fi
          # Purging again is "nothing to delete", not "the sandbox broke".
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X DELETE -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "404" ] || { echo "::error::second purge answered $code, expected 404"; exit 1; }

          # A file the agent cannot read. The agent runs as uid 1000; a
          # root-owned file with mode 0600 is unreadable for it — the
          # privilege mode makes this easy to create, and the host can
          # create one too.
          #
          # The door has to answer with a status code. A 200 that promises
          # N bytes and then delivers none reads as a broken connection:
          # the client blames the side-car for being unreachable, and the
          # operator goes looking at the network instead of at the file's
          # mode.
          #
          # Two ways to make the file unreadable, because they are not the
          # same: mode 000 on a file the agent owns, and a root-owned
          # 0600 file. The second one needs root (the agent's own
          # capability set is empty, so even root cannot write into its
          # workspace) — and the file has to land in the AGENT's own
          # workspace. The workspace is a tmpfs, and `--volumes-from`
          # copies volumes and binds, not tmpfs mounts: a helper
          # container would write into its own filesystem and the agent
          # would answer 404 instead of 403. `docker exec -u 0:0` runs
          # inside the agent's container, where the tmpfs is.
          docker exec ci-sandbox-agent \
            sh -c 'printf secret > /workspace/noaccess.bin; chmod 000 /workspace/noaccess.bin'
          code=$(curl -s -o /tmp/denied.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=noaccess.bin')
          [ "$code" = "403" ] \
            || { echo "::error::an unreadable file answered $code, expected 403"; cat /tmp/denied.json; exit 1; }
          grep -qi 'permission denied' /tmp/denied.json \
            || { echo "::error::the 403 does not say it is a permission problem"; exit 1; }

          docker exec -u 0:0 ci-sandbox-agent \
            sh -c 'umask 077; printf secret > /workspace/root-only.bin; ls -l /workspace/root-only.bin'
          code=$(curl -s -o /tmp/denied2.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=root-only.bin')
          [ "$code" = "403" ] \
            || { echo "::error::a root-owned file answered $code, expected 403"; cat /tmp/denied2.json; exit 1; }
          # No cleanup: the agent container drops every capability, so even
          # root cannot unlink those files from the workspace — and the
          # workspace is a tmpfs, so it dies with the container.

      # The logs must be JSON — every line of them, the access log
      # included. uvicorn installs an access log of its own, in plain
      # text, when the server starts; the application's records being
      # JSON is only half the job. A container whose stdout is half JSON
      # is a log that half of the queries silently miss, and the part
      # that is missed is the part that says who called what.
      - name: The logs are JSON — the access log included
        env:
          # compose interpolates the environment of the file it reads,
          # and it refuses to do anything without a token — even for
          # `logs`, which needs no token to work.
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml logs --no-log-prefix > /tmp/logs.txt || true
          echo "--- log sample:"; head -5 /tmp/logs.txt
          # uvicorn's plain-text access line: '127.0.0.1:1234 - "GET /x HTTP/1.1" 200 OK'
          if grep -qE ' - "(GET|POST|PUT|DELETE|PATCH) ' /tmp/logs.txt; then
            echo "::error::the access log is not JSON"
            grep -nE ' - "(GET|POST|PUT|DELETE|PATCH) ' /tmp/logs.txt | head -5
            exit 1
          fi
          # Every line that looks like a record must parse as JSON.
          python3 -c "
          import json, sys
          bad = []
          for n, line in enumerate(open('/tmp/logs.txt', encoding='utf-8', errors='replace'), 1):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  json.loads(line)
              except ValueError as exc:
                  bad.append((n, str(exc), line[:200]))
          for n, exc, line in bad[:5]:
              print('::error::log line %d is not JSON: %s: %s' % (n, exc, line))
          sys.exit(1 if bad else 0)
          "
          # And there has to be an access record — otherwise the check
          # above proved nothing about the access log.
          grep -q '"msg": *"access"' /tmp/logs.txt \
            || { echo "::error::no JSON access record in the logs"; exit 1; }
          grep -q '"path": *"/' /tmp/logs.txt \
            || { echo "::error::the access record does not carry the path"; exit 1; }

      # The metrics endpoint exists, and it is not an open door.
      - name: The metrics answer — and only with the token
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://127.0.0.1:8099/metrics)
          [ "$code" = "401" ] \
            || { echo "::error::/metrics answered $code without a token, expected 401"; exit 1; }
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8099/metrics > /tmp/metrics.txt
          grep -q '^# TYPE sandbox_proxy_requests_total counter' /tmp/metrics.txt \
            || { echo "::error::the proxy does not expose the request counter"; head -20 /tmp/metrics.txt; exit 1; }
          grep -qE '^sandbox_proxy_requests_total [0-9]+' /tmp/metrics.txt \
            || { echo "::error::the request counter has no value"; exit 1; }

      # The monitoring example must parse. It is a separate compose
      # project, so nothing else in this job touches it — and a compose
      # file that does not parse is an example that does not run.
      - name: The monitoring example is a valid compose file
        run: docker compose -f docker-compose.monitoring.yml config > /dev/null

      - name: Dump logs on failure
        if: failure()
        env:
          # Without the token, compose refuses to interpolate the file
          # and prints nothing at all — the step that exists to show
          # the logs was showing none.
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: docker compose -f docker-compose.ci.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  privilege:
    name: Privilege mode (sudo + a root that can actually write)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The privilege mode is a configuration switch, so the only way to
      # test it is to turn it on and use it. Two facts have to hold, and
      # they are independent:
      #
      #   1. the escalation works (sudo -> uid 0);
      #   2. the root is *useful* — apt-get needs /var/lib/apt/lists,
      #      /var/lib/dpkg and /usr to be writable, and a read-only root
      #      filesystem refuses all three.
      #
      # A deployment that satisfies (1) and not (2) is a half-root: the
      # model gets "Read-only file system" and calls the sandbox broken.
      # Both halves are checked here, against the shipped image.
      - name: Build the agent image with sudo
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
        run: docker compose -f docker-compose.ci.yml build sandbox-agent

      - name: Escalation works, but a read-only rootfs stops apt
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
          AGENT_NO_NEW_PRIVILEGES: "false"
          AGENT_CAP_DROP: SYS_ADMIN
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml up -d --force-recreate sandbox-agent
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]; do sleep 3; done' \
            || { echo "::error::the agent never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

          # The escalation itself.
          docker exec ci-sandbox-agent sh -c 'sudo -n id' | tee /tmp/id.txt
          grep -q 'uid=0(root)' /tmp/id.txt \
            || { echo "::error::sudo did not escalate to root"; exit 1; }

          # The stock root filesystem is read-only, and root cannot write
          # to it either. This is the half-root the fourth setting fixes.
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' ci-sandbox-agent)" = "true" ] \
            || { echo "::error::the stock agent container is not read-only"; exit 1; }
          out=$(docker exec ci-sandbox-agent sh -c 'sudo -n apt-get update' 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -qi 'read-only file system' \
            || { echo "::error::apt-get wrote to a read-only rootfs"; exit 1; }

      - name: The privilege mode is announced at start-up
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
          AGENT_NO_NEW_PRIVILEGES: "false"
          AGENT_CAP_DROP: SYS_ADMIN
        run: |
          set -euo pipefail
          # The documentation promises a warning at start-up when sudo
          # is present (docs/SECURITY.md §9). The unit tests cover the
          # function; this covers the claim about the *shipped image* —
          # the warning has to reach the log of a container that really
          # has sudo in it, and the hollow root has to be named with it.
          logs=$(docker compose -f docker-compose.ci.yml logs sandbox-agent)
          echo "$logs" | grep -q 'the privilege mode is ON' \
            || { echo "::error::the privilege mode was not announced"; echo "$logs" | tail -20; exit 1; }
          echo "$logs" | grep -q 'the root filesystem is READ-ONLY' \
            || { echo "::error::the hollow root was not announced"; exit 1; }
          echo "the privilege mode is announced at start-up"

      - name: AGENT_READ_ONLY=false gives the root a filesystem it can write
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          # The agent and the proxy share one token, so the agent's own
          # API can be reached with it from inside the container.
          TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
          AGENT_NO_NEW_PRIVILEGES: "false"
          AGENT_CAP_DROP: SYS_ADMIN
          AGENT_READ_ONLY: "false"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml up -d --force-recreate sandbox-agent
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]; do sleep 3; done' \
            || { echo "::error::the agent never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' ci-sandbox-agent)" = "false" ] \
            || { echo "::error::AGENT_READ_ONLY=false did not make the rootfs writable"; exit 1; }

          # The image ships without the apt index (it is removed at build
          # time to keep the image small), so the update comes first.
          docker exec ci-sandbox-agent sh -c 'sudo -n apt-get update -qq' \
            || { echo "::error::apt-get update failed on a writable rootfs"; exit 1; }
          # `bc` and not `cowsay`: cowsay installs into /usr/games, which
          # is deliberately not on the PATH, so "the package is on the
          # PATH" would be a false requirement. `bc` lands in /usr/bin.
          docker exec ci-sandbox-agent sh -c 'sudo -n apt-get install -y -qq --no-install-recommends bc' \
            || { echo "::error::apt-get install failed"; exit 1; }
          docker exec ci-sandbox-agent sh -c 'command -v bc' \
            || { echo "::error::the installed package is not on the PATH"; exit 1; }
          # The package must be usable, not merely present.
          docker exec ci-sandbox-agent sh -c 'echo "2+3" | sudo -n bc' | grep -q '^5$' \
            || { echo "::error::the installed package does not run"; exit 1; }
          echo "the privilege mode installs packages"

          # And the install has to come back with its answer. `apt-get`
          # reads stdin, and before v2.10.2 the command ate the protocol
          # lines that followed it: the package was installed and the
          # answer was lost, so the caller only saw a timeout.
          #
          # The install is a no-op here (the step above installed it
          # already) — that is the point: the *answer* is what is being
          # checked, and it has to arrive with the output intact.
          out=$(docker exec ci-sandbox-agent curl -fsS --max-time 180 \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"command":"sudo -n apt-get install -y -qq --no-install-recommends bc","timeout":120}' \
            http://127.0.0.1:8082/sessions/ci-apt/exec)
          echo "$out" | tail -c 400
          echo "$out" | grep -q '"timed_out": *false' \
            || { echo "::error::the install timed out instead of answering"; exit 1; }
          echo "$out" | grep -q '"exit_code": *0' \
            || { echo "::error::the install failed: $out"; exit 1; }
          echo "$out" | grep -qi 'bc' \
            || { echo "::error::the install came back without its output"; exit 1; }
          echo "the install answers with its output"

      - name: Dump logs on failure
        if: failure()
        env:
          # Without the token, compose refuses to interpolate the file
          # and prints nothing at all — the step that exists to show
          # the logs was showing none.
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: docker compose -f docker-compose.ci.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  mutation-checks:
    name: Mutation checks (the tripwires can still go red)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Every mutation check must catch its mutation
        run: |
          set -uo pipefail
          # Each script breaks one property of the code on purpose and
          # expects the named test to go red. A check that cannot be
          # made red is not a check — and it rots silently: four of
          # these patterns had drifted away from the code, so their
          # mutations did not even apply, and the scripts were not run
          # anywhere at all. They run here now, on every push.
          for script in tools/mutation-check-*.sh; do
            echo "::group::${script}"
            if ! PY="$(command -v python3)" bash "${script}"; then
              echo "::error::${script} did not hold — a tripwire that cannot be made red is decoration"
              exit 1
            fi
            echo "::endgroup::"
          done

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the parent commit so gitleaks-action can scan the
          # diff between baseRef^ and headRef. Default fetch-depth: 1
          # leaves only HEAD, and the action fails with
          # "Unexpected exit code [1]" (partial scan).
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

