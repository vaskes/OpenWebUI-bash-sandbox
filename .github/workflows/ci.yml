name: CI

# Least-privilege: default to read-only token permissions, override
# per-job only when a job needs write access (none currently do —
# lint, test, SAST, and gitleaks all just read the repo).
# Resolves CodeQL alert `actions/missing-workflow-permissions`.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tmux is not in the runner image, and the strongest tripwires in
      # this suite need a real one: a ~400 KB command output must come
      # back whole on every run, and a session must survive a cold tmux
      # server. Without tmux those tests skip, and the gate silently
      # stops guarding the thing it was written for.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70 tests/ || \
            coverage run --source=. -m unittest discover -s tests && \
            coverage report --fail-under=70
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml

  sast:
    name: SAST (ruff B-rules)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Bandit was replaced by ruff's B-rules — same coverage on the
      # patterns we care about (subprocess injection, weak crypto,
      # hardcoded creds) without the install-on-CI failure mode.
      - name: Ruff B-rules scan
        run: ruff check . --select B --output-format=concise

  # v2.5.0: this job exists because v2.4.x shipped green CI and did not
  # build. `docker build` failed with "GID '1000' already exists"; nothing
  # in the pipeline ever ran it. Tests ran against the runner's pip
  # environment, not against the artifacts we ship — false confidence,
  # which is worse than no tests. Everything above this line exercises the
  # Python source; only this line exercises the deliverable.
  deploy:
    name: Deploy (docker build + boot + smoke)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No .env in the repo, and the Makefile check-env target would fail
      # on the placeholder values. Pass the token through the environment
      # instead so compose's ${VAR:?} guard sees a real value.
      - name: Build both images from a clean tree
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: docker compose -f docker-compose.ci.yml build

      - name: Boot the stack and wait for both containers to be healthy
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          docker compose -f docker-compose.ci.yml up -d
          # `up -d` returns before the healthchecks pass, and a failure
          # here is the whole point of this job — do not skip the wait.
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]                                  && [ "$(docker inspect -f "{{.State.Health.Status}}" ci-openapi-proxy  2>/dev/null)" = healthy ]; do
                               sleep 3
                             done'             || { echo "::error::containers never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

      # The load-bearing step. A container can report healthy while every
      # request 500s; only executing a real command proves the stack works.
      # This is what catches "No module named uvicorn" and FastAPI
      # constructor drift — neither shows up in a process liveness check.
      - name: Smoke test — execute a real command end to end
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          out=$(curl -fsS --max-time 120 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"echo ci-smoke-ok && id -u","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash)
          echo "proxy response: $out"
          echo "$out" | grep -q 'ci-smoke-ok' || { echo "::error::command did not execute"; exit 1; }
          # uid must be the unprivileged 1000 the compose contract promises.
          echo "$out" | grep -qE '(^|[^0-9])1000([^0-9]|$)' \
            || { echo "::error::agent is not running as uid 1000"; exit 1; }

      - name: Agent healthz must not leak the workspace path
        run: |
          # docker exec on the container directly, NOT `docker compose exec`:
          # compose re-parses the file and fails interpolation on
          # ${OPENAPI_PROXY_TOKEN:?}, which this step has no reason to carry.
          # The agent publishes no host port, so it is reached in-network.
          body=$(docker exec ci-sandbox-agent curl -fsS http://127.0.0.1:8082/healthz)
          echo "agent healthz: $body"
          [ "$body" = '{"status":"ok"}' ] \
            || { echo "::error::unexpected healthz body"; exit 1; }
          # Belt and braces: v2.4.1 leaked WORKSPACE_REAL here, v2.4.3
          # trimmed it. Assert the absence, not just the exact body.
          case "$body" in
            */workspace*|*WORKSPACE*|*"os.environ"*)
              echo "::error::healthz leaks host detail"; exit 1 ;;
          esac

      # The binary door. A file created in the sandbox must come back
      # through the proxy byte for byte — the whole point of the endpoint
      # is that an agent can move a file out without base64, and base64
      # through a pane loses the beginning of the payload without saying
      # so. A unit test can mock the transport; only this can prove the
      # two services actually agree on the bytes.
      - name: Binary transfer — the bytes must survive the round trip
        env:
          TOKEN: ci-smoke-token-not-a-secret-0000
        run: |
          set -euo pipefail
          # Create the probe through the tool the agent itself uses.
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"printf ci-binary-probe-payload | tee /workspace/probe.bin >/dev/null && sha256sum /workspace/probe.bin","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash > /tmp/mk.json
          expected=$(grep -o '[0-9a-f]\{64\}' /tmp/mk.json | head -1)
          [ -n "$expected" ] || { echo "::error::could not create the probe file"; exit 1; }

          # Pull it back out through the proxy.
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" \
            -o /tmp/probe.bin 'http://127.0.0.1:8099/files?path=probe.bin'
          actual=$(sha256sum /tmp/probe.bin | cut -d' ' -f1)
          [ "$actual" = "$expected" ] \
            || { echo "::error::sha256 mismatch: $actual != $expected"; exit 1; }

          # The headers a client needs in order to plan a transfer.
          curl -fsS -D /tmp/hdr -o /dev/null --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin'
          grep -qi '^accept-ranges: *bytes' /tmp/hdr || { echo "::error::no Accept-Ranges"; exit 1; }
          grep -qi '^content-length:' /tmp/hdr || { echo "::error::no Content-Length"; exit 1; }

          # A range request must answer 206 with the right slice.
          code=$(curl -s -o /tmp/part.bin -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" -H 'Range: bytes=3-8' \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "206" ] || { echo "::error::range request answered $code"; exit 1; }
          [ "$(cat /tmp/part.bin)" = "binary" ] \
            || { echo "::error::range request returned the wrong bytes"; exit 1; }

          # A file over the policy limit is refused — and says how big it
          # really is, so the caller can decide what to do about it.
          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"command":"head -c 3000000 /dev/zero > /workspace/big.bin","session_id":"ci-smoke","timeout":30}' \
            http://127.0.0.1:8099/bash > /dev/null
          code=$(curl -s -o /tmp/err.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=big.bin')
          [ "$code" = "413" ] || { echo "::error::oversized file answered $code, expected 413"; exit 1; }
          grep -q '3000000' /tmp/err.json \
            || { echo "::error::the 413 does not name the real size"; exit 1; }

          # The purge. The sandbox is a scratchpad: once a client has
          # delivered a file, it removes the copy it made. This has to
          # work in the shipped artifact, not just in a unit test — a
          # delete endpoint that answers 204 and leaves the file on disk
          # is worse than no endpoint at all, because the client trusts
          # it.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X DELETE -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "204" ] || { echo "::error::purge answered $code, expected 204"; exit 1; }
          if docker exec ci-sandbox-agent ls /workspace/probe.bin >/dev/null 2>&1; then
            echo "::error::the file is still in the workspace after the purge"; exit 1
          fi
          # Purging again is "nothing to delete", not "the sandbox broke".
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X DELETE -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=probe.bin')
          [ "$code" = "404" ] || { echo "::error::second purge answered $code, expected 404"; exit 1; }

          # A file the agent cannot read. The agent runs as uid 1000; a
          # root-owned file with mode 0600 is unreadable for it — the
          # privilege mode makes this easy to create, and the host can
          # create one too.
          #
          # The door has to answer with a status code. A 200 that promises
          # N bytes and then delivers none reads as a broken connection:
          # the client blames the side-car for being unreachable, and the
          # operator goes looking at the network instead of at the file's
          # mode.
          #
          # Two ways to make the file unreadable, because they are not the
          # same: mode 000 on a file the agent owns, and a root-owned
          # 0600 file. The second one needs a container with the default
          # capability set (the agent's own has an empty one, so even root
          # cannot write into its workspace) — it borrows the volume and
          # nothing else.
          docker exec ci-sandbox-agent \
            sh -c 'printf secret > /workspace/noaccess.bin; chmod 000 /workspace/noaccess.bin'
          code=$(curl -s -o /tmp/denied.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=noaccess.bin')
          [ "$code" = "403" ] \
            || { echo "::error::an unreadable file answered $code, expected 403"; cat /tmp/denied.json; exit 1; }
          grep -qi 'permission denied' /tmp/denied.json \
            || { echo "::error::the 403 does not say it is a permission problem"; exit 1; }

          AGENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' ci-sandbox-agent)
          docker run --rm --user 0:0 --volumes-from ci-sandbox-agent \
            --entrypoint sh "$AGENT_IMAGE" \
            -c 'umask 077; printf secret > /workspace/root-only.bin; ls -l /workspace/root-only.bin'
          code=$(curl -s -o /tmp/denied2.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8099/files?path=root-only.bin')
          [ "$code" = "403" ] \
            || { echo "::error::a root-owned file answered $code, expected 403"; cat /tmp/denied2.json; exit 1; }
          # No cleanup: the agent container drops every capability, so even
          # root cannot unlink those files from the workspace — and the
          # tear-down step deletes the volume anyway.

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  privilege:
    name: Privilege mode (sudo + a root that can actually write)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The privilege mode is a configuration switch, so the only way to
      # test it is to turn it on and use it. Two facts have to hold, and
      # they are independent:
      #
      #   1. the escalation works (sudo -> uid 0);
      #   2. the root is *useful* — apt-get needs /var/lib/apt/lists,
      #      /var/lib/dpkg and /usr to be writable, and a read-only root
      #      filesystem refuses all three.
      #
      # A deployment that satisfies (1) and not (2) is a half-root: the
      # model gets "Read-only file system" and calls the sandbox broken.
      # Both halves are checked here, against the shipped image.
      - name: Build the agent image with sudo
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
        run: docker compose -f docker-compose.ci.yml build sandbox-agent

      - name: Escalation works, but a read-only rootfs stops apt
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
          AGENT_NO_NEW_PRIVILEGES: "false"
          AGENT_CAP_DROP: SYS_ADMIN
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml up -d --force-recreate sandbox-agent
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]; do sleep 3; done' \
            || { echo "::error::the agent never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

          # The escalation itself.
          docker exec ci-sandbox-agent sh -c 'sudo -n id' | tee /tmp/id.txt
          grep -q 'uid=0(root)' /tmp/id.txt \
            || { echo "::error::sudo did not escalate to root"; exit 1; }

          # The stock root filesystem is read-only, and root cannot write
          # to it either. This is the half-root the fourth setting fixes.
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' ci-sandbox-agent)" = "true" ] \
            || { echo "::error::the stock agent container is not read-only"; exit 1; }
          out=$(docker exec ci-sandbox-agent sh -c 'sudo -n apt-get update' 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -qi 'read-only file system' \
            || { echo "::error::apt-get wrote to a read-only rootfs"; exit 1; }

      - name: AGENT_READ_ONLY=false gives the root a filesystem it can write
        env:
          OPENAPI_PROXY_TOKEN: ci-smoke-token-not-a-secret-0000
          AGENT_ALLOW_SUDO: "1"
          AGENT_NO_NEW_PRIVILEGES: "false"
          AGENT_CAP_DROP: SYS_ADMIN
          AGENT_READ_ONLY: "false"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml up -d --force-recreate sandbox-agent
          timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ci-sandbox-agent 2>/dev/null)" = healthy ]; do sleep 3; done' \
            || { echo "::error::the agent never became healthy"; docker compose -f docker-compose.ci.yml logs; exit 1; }

          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' ci-sandbox-agent)" = "false" ] \
            || { echo "::error::AGENT_READ_ONLY=false did not make the rootfs writable"; exit 1; }

          # The image ships without the apt index (it is removed at build
          # time to keep the image small), so the update comes first.
          docker exec ci-sandbox-agent sh -c 'sudo -n apt-get update -qq' \
            || { echo "::error::apt-get update failed on a writable rootfs"; exit 1; }
          # `bc` and not `cowsay`: cowsay installs into /usr/games, which
          # is deliberately not on the PATH, so "the package is on the
          # PATH" would be a false requirement. `bc` lands in /usr/bin.
          docker exec ci-sandbox-agent sh -c 'sudo -n apt-get install -y -qq --no-install-recommends bc' \
            || { echo "::error::apt-get install failed"; exit 1; }
          docker exec ci-sandbox-agent sh -c 'command -v bc' \
            || { echo "::error::the installed package is not on the PATH"; exit 1; }
          # The package must be usable, not merely present.
          docker exec ci-sandbox-agent sh -c 'echo "2+3" | sudo -n bc' | grep -q '^5$' \
            || { echo "::error::the installed package does not run"; exit 1; }
          echo "the privilege mode installs packages"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the parent commit so gitleaks-action can scan the
          # diff between baseRef^ and headRef. Default fetch-depth: 1
          # leaves only HEAD, and the action fails with
          # "Unexpected exit code [1]" (partial scan).
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

