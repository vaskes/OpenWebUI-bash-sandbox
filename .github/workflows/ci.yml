name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70 tests/ || \
            coverage run --source=. -m unittest discover -s tests && \
            coverage report --fail-under=70
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit
      - name: Bandit scan
        # Fail on medium+ severity. Skip B101 (assert) for test files.
        run: |
          bandit -r . -ll -i --skip B101

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test, sast]
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox-agent image
        run: docker build -f Dockerfile.sandbox -t owbs-sandbox:test .
      - name: Build openapi-proxy image
        run: docker build -f Dockerfile.openapi-proxy -t owbs-proxy:test .
      - name: Smoke-test sandbox-agent image
        run: |
          docker run --rm -d --name sandbox-test \
            -e AGENT_TOKEN=smoke-test-token owbs-sandbox:test
          sleep 5
          # Fail loudly if the container died, if the healthcheck failed,
          # or if the start-up log does not show uvicorn accepting requests.
          docker logs sandbox-test 2>&1 | grep -q "Uvicorn running" || { echo "sandbox-agent did not start"; docker logs sandbox-test; exit 1; }
          docker exec sandbox-test curl -fsS http://127.0.0.1:8082/healthz || { echo "sandbox-agent healthz failed"; exit 1; }
          # Confirm auth is enforced: hit /sessions without a bearer, expect 503
          # (because in fresh container AGENT_TOKEN is required but we set it
          # above — the test is that the bearer is REQUIRED, so /sessions
          # without one must 401).
          docker exec sandbox-test curl -s -o /dev/null -w "%{http_code}\n" \
            http://127.0.0.1:8082/sessions | grep -q 401 || \
            { echo "sandbox-agent did not enforce auth"; exit 1; }
          docker stop sandbox-test
      - name: Smoke-test openapi-proxy image
        run: |
          docker run --rm -d --name proxy-test \
            -e OPENAPI_PROXY_TOKEN=smoke-test-token owbs-proxy:test
          sleep 5
          docker logs proxy-test 2>&1 | grep -q "Uvicorn running" || { echo "openapi-proxy did not start"; docker logs proxy-test; exit 1; }
          docker exec proxy-test curl -fsS http://127.0.0.1:8090/openapi.json | head -c 200 || { echo "proxy openapi.json failed"; exit 1; }
          # /healthz without bearer must 401.
          docker exec proxy-test curl -s -o /dev/null -w "%{http_code}\n" \
            http://127.0.0.1:8090/healthz | grep -q 401 || \
            { echo "proxy did not enforce auth on /healthz"; exit 1; }
          docker stop proxy-test

  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f Dockerfile.sandbox -t owbs-sandbox:test .
          docker build -f Dockerfile.openapi-proxy -t owbs-proxy:test .
      - name: Scan sandbox-agent image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: owbs-sandbox:test
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan openapi-proxy image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: owbs-proxy:test
          severity: HIGH,CRITICAL
          exit-code: "1"

  codeql:
    name: CodeQL (security)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
