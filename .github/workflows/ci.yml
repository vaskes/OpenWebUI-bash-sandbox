name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build sandbox-agent image
        run: docker build -f Dockerfile.sandbox -t owbs-sandbox:test .

      - name: Build openapi-proxy image
        run: docker build -f Dockerfile.openapi-proxy -t owbs-proxy:test .

      - name: Smoke-test sandbox-agent image
        run: |
          docker run --rm -d --name sandbox-test owbs-sandbox:test
          sleep 5
          docker exec sandbox-test curl -fsS http://127.0.0.1:8082/healthz
          docker stop sandbox-test

      - name: Smoke-test openapi-proxy image
        run: |
          docker run --rm -d --name proxy-test owbs-proxy:test
          sleep 5
          docker exec proxy-test curl -fsS http://127.0.0.1:8090/openapi.json | head -c 200
          docker stop proxy-test
