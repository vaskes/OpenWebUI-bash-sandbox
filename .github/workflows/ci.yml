name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=70 tests/ || \
            coverage run --source=. -m unittest discover -s tests && \
            coverage report --fail-under=70
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit
      - name: Bandit scan
        # Fail on medium+ severity. Skip B101 (assert) for test files.
        run: |
          bandit -r . -ll -i --skip B101

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test, sast]
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox-agent image
        run: docker build -f Dockerfile.sandbox -t owbs-sandbox:test .
      - name: Build openapi-proxy image
        run: docker build -f Dockerfile.openapi-proxy -t owbs-proxy:test .
      - name: Smoke-test sandbox-agent image
        run: |
          docker run --rm -d --name sandbox-test owbs-sandbox:test
          sleep 5
          docker exec sandbox-test curl -fsS http://127.0.0.1:8082/healthz
          docker stop sandbox-test
      - name: Smoke-test openapi-proxy image
        run: |
          docker run --rm -d --name proxy-test owbs-proxy:test
          sleep 5
          docker exec proxy-test curl -fsS http://127.0.0.1:8090/openapi.json | head -c 200
          docker stop proxy-test

  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f Dockerfile.sandbox -t owbs-sandbox:test .
          docker build -f Dockerfile.openapi-proxy -t owbs-proxy:test .
      - name: Scan sandbox-agent image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: owbs-sandbox:test
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan openapi-proxy image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: owbs-proxy:test
          severity: HIGH,CRITICAL
          exit-code: "1"
