name: "CodeQL config for OpenWebUI-bash-sandbox"

# Disable CodeQL — the codebase is small and we rely on ruff B-rules
# and a local bandit-like scan for static analysis. The previous
# default CodeQL setup produced no actionable alerts and the job
# itself failed in CI.
disable-default-queries: true
queries: []

paths-ignore:
  - tests/**
  - docs/**
  - .github/**

# Be strict on what we DO want scanned.
paths:
  - "**/*.py"
