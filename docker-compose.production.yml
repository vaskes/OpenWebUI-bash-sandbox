name: telegrambot-sandbox

# Production sandbox side-car for the telegram bot on llmhost1.
#
# Upstream: github.com/vaskes/OpenWebUI-bash-sandbox @ v2.14.8
# Cloned fresh into this directory — nothing is copied from llmhost2.
#
# The bot reaches this through the openapi-proxy's bearer-authenticated
# /bash endpoint. The proxy is the only service with a published port;
# sandbox-agent stays on the internal bridge. Network isolation is the
# primary control, the token is defence in depth.
#
# Ports: proxy 8090 (the bot's AGENT_STACK_URL target), agent 8082 internal.
#
# Deploy with:  docker compose -f docker-compose.production.yml up -d --build
#
# The --build is not optional. Both services are built from this checkout and
# carry no image pin, so plain `up -d` reuses whatever image is already tagged
# and silently runs the previous code. Verified 2026-10-20: after editing
# agent_core.py, `up -d` kept serving the old version while `up -d --build`
# picked the change up immediately.

services:
  sandbox-agent:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        # The privilege mode. 0 = the agent's shell cannot become root:
        # there is no sudo in the image and no setuid binary that could
        # help. 1 = the image ships sudo and a NOPASSWD rule, so a
        # command can run `sudo su` and become root inside the container.
        # PRIVATE, SECURED DEPLOYMENTS ONLY — see docs/SECURITY.md.
        AGENT_ALLOW_SUDO: "${AGENT_ALLOW_SUDO:-0}"
    container_name: tb-sandbox-agent
    restart: unless-stopped
    networks:
      - tb-net
    # No host port — reachable only from openapi-proxy on the bridge.
    expose:
      - "8082"
    # Non-root with an explicit UID so bind-mount ownership on the host
    # is predictable. The host workspace must be writable by uid 1000.
    user: "1000:1000"
    working_dir: /workspace
    mem_limit: 4g
    cpus: "4.0"
    # How many processes the agent's shell may spawn. 256 is the safe
    # default — a fork-bomb dies here, not on the host. Raise it when a
    # build fans out (make -j, npm, pip workers) and the legitimate
    # processes start failing with "Resource temporarily unavailable".
    pids_limit: "${AGENT_PIDS_LIMIT:-256}"
    # The runtime half of the privilege mode. The defaults are the stock
    # posture: an empty capability set and no-new-privileges on. To let
    # the agent's shell become root, both have to give way — the setuid
    # bit is inert while no-new-privileges is on, and su cannot work at
    # all while the bounding set is empty. See docs/SECURITY.md,
    # "The privilege mode".
    cap_drop:
      - "${AGENT_CAP_DROP:-ALL}"
    security_opt:
      - "no-new-privileges:${AGENT_NO_NEW_PRIVILEGES:-true}"
    stop_grace_period: 30s
    # A read-only root filesystem is the stock posture: the agent writes
    # only through the bind-mounts and the tmpfs. It is also the fourth
    # setting of the privilege mode, and the one that decides whether a
    # root shell is useful: a root in a read-only container owns the
    # filesystem and cannot change a byte of it — apt-get needs three
    # writable paths (/var/lib/apt/lists, /var/lib/dpkg and /usr) and
    # gets "Read-only file system" for all three. Set
    # AGENT_READ_ONLY=false for a deployment whose privileged root has
    # to install packages. See docs/SECURITY.md, "The privilege mode".
    read_only: "${AGENT_READ_ONLY:-true}"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=64m,mode=755
    volumes:
      - /opt/telegrambot/sandbox-workspace:/workspace
      - /opt/telegrambot/ssh-keys:/home/agent/.ssh:ro
      # NOTE: there is deliberately NO volume mounted at /home/agent.
      # The application code lives there (WORKDIR is /home/agent so the
      # import path resolves), so a volume at that path shadows agent_api.py
      # and agent_core.py with the copy seeded on the *first* deploy. Every
      # later image rebuild is then silently ignored and the agent keeps
      # running whatever it ran the first time. Verified: with the volume
      # mounted, a redeploy after any code change serves the old module.
      # The writable paths the agent actually needs are mounted separately
      # below, so nothing is lost by leaving /home/agent image-owned.
      - tb-sandbox-apt:/var/cache/apt:rw
      - tb-sandbox-pip:/home/agent/.cache/pip:rw
    environment:
      - AGENT_WORKSPACE=/workspace
      - AGENT_SESSIONS_FILE=/workspace/.agent-sessions.json
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-INFO}
      # How much text one command may return. 32k..1024k.
      # The pane scrollback is derived from it, so the limit is
      # honest: an output that fits comes back whole, every time.
      - AGENT_STDOUT_LIMIT=${AGENT_STDOUT_LIMIT:-512k}
      # How large a file the binary endpoint will serve. 0 = unlimited.
      # Bytes never travel through stdout, so this is policy, not transport.
      - AGENT_BINARY_LIMIT=${AGENT_BINARY_LIMIT:-2048k}
      # How many bytes one MCP read_file may put into a model's context.
      # 0 = no budget of its own. The HTTP /files door keeps its own
      # limit: there the bytes land in a file, not in a prompt.
      - AGENT_MCP_MAX_READ_BYTES=${AGENT_MCP_MAX_READ_BYTES:-1m}
      - AGENT_TOKEN=${AGENT_STACK_TOKEN:?AGENT_STACK_TOKEN must be set}
      # The Host header values the MCP endpoint answers for. Empty =
      # no check at all — the check is off by default. A deployment
      # behind a domain names it here, or the MCP endpoint answers 421.
      - AGENT_MCP_ALLOWED_HOSTS=${AGENT_MCP_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  openapi-proxy:
    build:
      context: .
      dockerfile: Dockerfile.openapi-proxy
    container_name: tb-openapi-proxy
    restart: unless-stopped
    networks:
      - tb-net
    # Bound to loopback only: the bot runs in host network mode and
    # reaches this at 127.0.0.1:8090. Nothing on the LAN needs it.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - SANDBOX_URL=http://sandbox-agent:8082
      - OPENAPI_PROXY_TOKEN=${AGENT_STACK_TOKEN:?AGENT_STACK_TOKEN must be set}
      # The token the proxy uses to call sandbox-agent. Empty = the same
      # token as above, which is the usual single-trust-boundary case.
      - OPENAPI_PROXY_UPSTREAM_TOKEN=${OPENAPI_PROXY_UPSTREAM_TOKEN:-}
      - OPENAPI_PROXY_RATE_LIMIT_RPM=${OPENAPI_PROXY_RATE_LIMIT_RPM:-120}
      - OPENAPI_PROXY_RATE_LIMIT_MAX_KEYS=${OPENAPI_PROXY_RATE_LIMIT_MAX_KEYS:-10000}
      - OPENAPI_PROXY_WEBSOCKET_IDLE_TIMEOUT=${OPENAPI_PROXY_WEBSOCKET_IDLE_TIMEOUT:-300}
      # The longest a single command may run. The proxy waits longer than this,
      # so the answer that says "this timed out" survives the trip.
      - AGENT_EXEC_TIMEOUT=${AGENT_EXEC_TIMEOUT:-60}
      - OPENAPI_PROXY_LOG_LEVEL=INFO
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    depends_on:
      sandbox-agent:
        condition: service_healthy
    healthcheck:
      test:
        # Python, not curl: the proxy image installs nothing from the
        # distribution, so there is no curl in it to call.
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/openapi.json', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  tb-sandbox-apt:
  tb-sandbox-pip:

networks:
  tb-net:
    driver: bridge