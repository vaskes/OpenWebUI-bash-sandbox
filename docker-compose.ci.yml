# Minimal stack for the CI ``deploy`` job.
#
# Deliberately excludes open-webui: it is a multi-GB image pull that has
# nothing to do with whether *our* images build and serve. What this file
# proves is the thing that was broken in v2.4.x — that a clean clone
# produces running containers.
#
# Only sandbox-agent and openapi-proxy are built; both are the artifacts
# we actually ship.

services:
  sandbox-agent:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        # The privilege mode — see docs/SECURITY.md. 0 = the agent's
        # shell cannot become root. 1 = the image ships sudo and the
        # rule that lets a command run `sudo su`. PRIVATE, SECURED
        # DEPLOYMENTS ONLY.
        AGENT_ALLOW_SUDO: "${AGENT_ALLOW_SUDO:-0}"
    container_name: ci-sandbox-agent
    restart: "no"
    networks: [ci-net]
    user: "1000:1000"
    working_dir: /workspace
    mem_limit: 2g
    cpus: "2.0"
    # How many processes the agent's shell may spawn. 256 is the safe
    # default — a fork-bomb dies here, not on the host. Raise it when a
    # build fans out (make -j, npm, pip workers) and the legitimate
    # processes start failing with "Resource temporarily unavailable".
    pids_limit: "${AGENT_PIDS_LIMIT:-256}"
    # The runtime half of the privilege mode. The defaults are the stock
    # posture: an empty capability set and no-new-privileges on. To let
    # the agent's shell become root, both have to give way.
    cap_drop: ["${AGENT_CAP_DROP:-ALL}"]
    security_opt: ["no-new-privileges:${AGENT_NO_NEW_PRIVILEGES:-true}"]
    stop_grace_period: 10s
    # The stock posture: a read-only root filesystem, like production.
    # The privilege mode's fourth setting — AGENT_READ_ONLY=false — makes
    # the root filesystem writable, which is what a root shell needs to
    # install packages. See docs/SECURITY.md, "The privilege mode".
    read_only: "${AGENT_READ_ONLY:-true}"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=64m,mode=755
    # Named volume, not a host bind-mount: CI has no host workspace to own.
    # This is the only writable path the agent needs.
    #
    # NOTE: there is deliberately NO volume mounted at /home/agent. The
    # application code lives there (WORKDIR is /home/agent so the import
    # path resolves), and Docker seeds a named volume from the image on
    # first use and never re-syncs it. A volume at that path therefore
    # shadows the code with the copy from the first run: on a fresh CI
    # volume the two coincide and nobody notices, but any stack that is
    # rebuilt and restarted keeps running its first-deploy code.
    volumes:
      - ci-agent-workspace:/workspace
    environment:
      - AGENT_WORKSPACE=/workspace
      - AGENT_SESSIONS_FILE=/workspace/.agent-sessions.json
      # INFO, not WARNING: the deploy job reads the logs to prove they
      # are JSON, and the access log is INFO by nature.
      - AGENT_LOG_LEVEL=INFO
      # How much text one command may return. 32k..1024k.
      # The pane scrollback is derived from it, so the limit is
      # honest: an output that fits comes back whole, every time.
      - AGENT_STDOUT_LIMIT=${AGENT_STDOUT_LIMIT:-512k}
      # How large a file the binary endpoint will serve. 0 = unlimited.
      # Bytes never travel through stdout, so this is policy, not transport.
      - AGENT_BINARY_LIMIT=${AGENT_BINARY_LIMIT:-2048k}
      # How many bytes one MCP read_file may put into a model's context.
      # 0 = no budget of its own. The HTTP /files door keeps its own
      # limit: there the bytes land in a file, not in a prompt.
      - AGENT_MCP_MAX_READ_BYTES=${AGENT_MCP_MAX_READ_BYTES:-1m}
      - AGENT_TOKEN=${OPENAPI_PROXY_TOKEN:?OPENAPI_PROXY_TOKEN must be set}
      # The Host header values the MCP endpoint answers for. Empty =
      # no check at all — the check is off by default. A deployment
      # behind a domain names it here, or the MCP endpoint answers 421.
      - AGENT_MCP_ALLOWED_HOSTS=${AGENT_MCP_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  openapi-proxy:
    build:
      context: .
      dockerfile: Dockerfile.openapi-proxy
    container_name: ci-openapi-proxy
    restart: "no"
    networks: [ci-net]
    ports:
      - "127.0.0.1:8099:8090"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 10s
    environment:
      - SANDBOX_URL=http://sandbox-agent:8082
      - OPENAPI_PROXY_TOKEN=${OPENAPI_PROXY_TOKEN:?OPENAPI_PROXY_TOKEN must be set}
      - OPENAPI_PROXY_RATE_LIMIT_RPM=0
      - AGENT_EXEC_TIMEOUT=${AGENT_EXEC_TIMEOUT:-60}
      - OPENAPI_PROXY_LOG_LEVEL=INFO
    depends_on:
      sandbox-agent:
        condition: service_healthy
    healthcheck:
      test:
        # Python, not curl: the proxy image installs nothing from the
        # distribution, so there is no curl in it to call.
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/openapi.json', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  ci-agent-workspace:

networks:
  ci-net:
    driver: bridge
