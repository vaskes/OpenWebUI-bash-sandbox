# The coverage measurement and its threshold live here, and nowhere else.
#
# `--cov=.` measures the test files too, and the test files are ~95%
# covered by the act of running them — so a gate on that TOTAL cannot
# fail whatever happens to the sources. Omitting the test directory
# leaves the sources, which are covered at 89%.
#
# The threshold is 85: four points below the measured number, so an
# ordinary change does not trip it and a real regression does. CI passes
# no threshold of its own, so this number is the one that counts.
[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
omit = ["tests/*"]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "E501",   # line length — we keep 100 by config but allow slight overflow for docstrings/comments
    "B008",   # FastAPI uses `Path()` etc in defaults — false positive
    "B904",   # raise in except is OK for our use
    "N812",   # we explicitly use _PROXY_CORE_VERSION, _AGENT_CORE_VERSION to avoid clobbering local __version__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",   # tests have sys.path manipulation before imports — by design
    "E701",   # mock helpers with compact if/return
    "B011",   # asserts in tests are fine
    "F401",   # dynamic imports in tests (try/except)
    "PLC0415", # we explicitly use try/except ImportError for optional deps
    "N812",   # same as main
]
"__init__.py" = ["F401"]
