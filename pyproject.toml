[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F401 - unused imports
# E501 - line too long (we set 100)
# W291 - trailing whitespace
# B008 - function call in default argument
# B904 - raise from
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "E501",   # line length — we keep 100 by config but allow slight overflow for docstrings/comments
    "B008",   # FastAPI uses `Path()` etc in defaults — false positive
    "B904",   # raise in except is OK for our use
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
"__init__.py" = ["F401"]
